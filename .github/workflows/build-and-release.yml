name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [unix, windows, macos]
    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js ${{ matrix.os }}
      uses: actions/setup-node@v1.4.0
      with:
        node-version: '14'
    - name: Install dependencies
      run: npm install
    - name: Build
      run: node build
    - name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        path: ./build/hyper-rpc-sdk
        name: hyper-rpc-sdk
